
name: Build Nyxvalle APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip Nyxvalle-Android-Cloud-Build.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p Nyxvalle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nyxvalle-APK
          path: Nyxvalle/app/build/outputs/apk/debug/app-debug.apk
